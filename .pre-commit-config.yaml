repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: public-boundary
        name: public boundary
        entry: uv run python tools/check_public_boundary.py
        language: system
        pass_filenames: false
      - id: clean-notebooks
        name: clean notebooks
        entry: uv run python tools/check_notebooks.py
        language: system
        pass_filenames: false
