[project]
name = "moyi-s2tt-lab"
version = "0.1.0"
description = "Training and distillation toolkit for compact multilingual speech translation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
moyi-s2tt = "moyi_s2tt.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "nbformat>=5.10,<6",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "moyi_s2tt"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["moyi_s2tt"]
